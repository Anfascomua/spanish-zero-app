    add(ger,`${x.ru} · герундий`,'Формы: герундий');
    add(part,`${x.ru} · причастие`,'Формы: причастия');
    add(part+'s',`${x.ru} · причастие, мн. ч.`,'Формы: причастия');
    if(part.endsWith('o')){
      add(part.slice(0,-1)+'a',`${x.ru} · причастие, жен. р.`,'Формы: причастия');
      add(part.slice(0,-1)+'as',`${x.ru} · причастие, жен. р., мн. ч.`,'Формы: причастия');
    }
  }
  // Несколько грамматически полезных форм прилагательных, если до 5000 ещё не дошли.
  for(const x of core.filter(x=>x.category.includes('Прилагатель')&&!x.es.includes(' ')&&x.es.endsWith('o'))){

    add(w+'as',`${x.ru} · женская форма, мн. ч.`,'Формы: прилагательные');

function pronounceRu(src){

  if(r.startsWith('ll')){tokens.push('й');i+=2;continue}
  if(r.startsWith('rr')){tokens.push('рр');i+=2;continue}
  if(/^qu[eéií]/.test(r)){tokens.push('к');i+=2;continue}
  if(/^gu[eéií]/.test(r)){tokens.push('г');i+=2;continue}
  if(r.startsWith('gü')){tokens.push('гу');i+=2;continue}
  let c=s[i],n=s[i+1]||'';
  const nextEI='eéií'.includes(n);
  const map={a:'а',á:'а',e:'э',é:'э',i:'и',í:'и',o:'о',ó:'о',u:'у',ú:'у',ü:'у',b:'б',v:'б',d:'д',f:'ф',k:'к',l:'л',m:'м',n:'н',ñ:'нь',p:'п',r:'р',s:'с',t:'т',x:'кс',z:'с',w:'у',y:'й'};

  tokens.push(map[c]??c);i++;
 }
 return tokens.join('').replace(/\s+/g,' ').trim();
}

 let p=getP(),cats=categoryList();
 let options=`<option value="all">Все категории (${BASE_WORDS.length})</option>`+cats.map(([c,n])=>`<option value="${c}" ${dictCategory===c?'selected':''}>${c} (${n})</option>`).join('');
 let trainOptions=`<option value="all">Все категории (${BASE_WORDS.length})</option>`+cats.map(([c,n])=>`<option value="${c}">${c} (${n})</option>`).join('');
 return header('Словарь')+`<main>
 <div class="trainer-box"><h3 style="margin:0 0 5px">🧠 Зубрёжка по категории</h3><p class="muted tiny">Выберите категорию и количество слов. После последнего слова набор начинается заново.</p><div class="trainer-grid"><div><label>Категория</label><select id="drill-category" class="selectbox">${trainOptions}</select></div><div><label>Слов</label><input id="drill-count" class="numberbox" type="number" min="1" max="${BASE_WORDS.length}" value="50"></div></div><label class="checkline"><input id="drill-only-new" type="checkbox" checked> Не брать уже выученные</label><button class="primary" onclick="startDrill()">Начать по категории</button></div>
 <div class="dict-selection-bar"><div><b id="dict-selected-count">Выбрано для учёбы: ${p.dictSelected.length}</b><div class="muted tiny">Поставьте флажок в колонке «Учить» у нужных слов.</div></div><button id="selected-train-btn" onclick="startSelectedDrill()" ${p.dictSelected.length?'':'disabled'} style="opacity:${p.dictSelected.length?'1':'.45'}">Учить выбранные (${p.dictSelected.length})</button></div>
 <input class="searchbox" type="search" value="${dictQuery.replaceAll('"','&quot;')}" placeholder="Поиск: hola, привет, ола…" oninput="updateDictionary(this.value)">
 <select class="selectbox category-select" onchange="setDictCategory(this.value)">${options}</select>
 <div class="filters"><button data-filter="all" class="filter-btn ${dictFilter==='all'?'active':''}" onclick="setDictFilter('all')">Все</button><button data-filter="selected" class="filter-btn ${dictFilter==='selected'?'active':''}" onclick="setDictFilter('selected')">Для учёбы</button><button data-filter="learned" class="filter-btn ${dictFilter==='learned'?'active':''}" onclick="setDictFilter('learned')">Выученные</button><button data-filter="new" class="filter-btn ${dictFilter==='new'?'active':''}" onclick="setDictFilter('new')">Невыученные</button></div>
 <div class="dict-meta"><b id="dict-count">Найдено: ${dictFiltered().length}</b><span id="dict-learned-count" class="muted">Выучено: ${p.dictLearned.length}/${BASE_WORDS.length}</span></div>
 <div class="dict-actions"><button onclick="selectVisible()">✓ Выбрать показанные</button><button onclick="clearSelection()">Снять выбор</button><button id="listen-selected-btn" class="accent" onclick="startSelectedListening()">▶ Прослушать выбранное</button><button id="listen-category-btn" onclick="startCategoryListening()">🔁 Прослушать категорию</button></div>
 <div id="dict-list" class="dict-table-wrap">${dictRows()}</div>
 </main>`+nav()
}
function drill(){if(!drillDeck.length)return header('Зубрёжка')+`<main><div class="card"><p>Набор ещё не выбран.</p><button class="primary" onclick="go('dictionary')">Выбрать слова</button></div></main>`+nav();let w=drillDeck[drillPos],p=getP(),learned=p.dictLearned.includes(w.id),learnedInDeck=drillDeck.filter(x=>p.dictLearned.includes(x.id)).length;return header('Зубрёжка')+`<main><div class="drill-top"><b>${drillPos+1} / ${drillDeck.length}</b><span class="muted">Выучено в наборе: ${learnedInDeck}</span></div><div class="drill-card"><div class="eyebrow">${w.category} · №${String(w.id).padStart(4,'0')}</div><div class="es">${w.es}</div><div class="tr">${w.tr}</div><div class="ru">${w.ru}</div><button class="speaker" style="position:absolute;right:18px;top:18px" onclick="say('${w.es.replaceAll("'","\\'")}')">🔊</button></div><div class="drill-learned"><label class="learned-check" style="margin:0!important"><input type="checkbox" ${learned?'checked':''} onchange="drillToggle(this.checked)"> Выучено</label></div><div class="drill-nav"><button onclick="drillMove(-1)">← Предыдущее</button><button onclick="drillMove(1)">Следующее →</button></div><button id="loop-card-btn" class="primary" onclick="startLoopListening(true)">▶ Прослушать выбранное</button><div class="success-note">🔊 При каждом перелистывании слово произносится автоматически. Кнопка динамика повторяет озвучку.</div><button class="primary" style="background:#f2eee8;color:#231f20" onclick="go('dictionary')">Сменить набор</button></main>`+nav()}
function progress(){let p=getP(),pct=Math.round(p.completed.length/lessons.length*100);return header('Прогресс')+`<main><div class="stats"><div class="stat"><b>${p.completed.length}</b><span>уроков</span></div><div class="stat"><b>${p.dictLearned.length}</b><span>слов выучено</span></div><div class="stat"><b>${p.streak}</b><span>дней подряд</span></div><div class="stat"><b>${pct}%</b><span>курса</span></div></div><div class="card" style="margin-top:14px"><h3>🏆 Продолжайте</h3><p class="muted">Даже 10 минут в день дают результат, если повторять регулярно.</p></div></main>`+nav()}
function settings(){let fs=getFontSize(),th=getTheme();return header('Настройки')+`<main><div class="card"><div class="setting-label"><div><h3 style="margin:0">Тема интерфейса</h3><p class="muted" style="margin:5px 0 0">Выберите светлое или тёмное оформление.</p></div><b>${th==='dark'?'🌙':'☀️'}</b></div><div class="theme-options"><button class="theme-choice ${th==='light'?'active':''}" onclick="setTheme('light')">☀️ Светлая</button><button class="theme-choice ${th==='dark'?'active':''}" onclick="setTheme('dark')">🌙 Тёмная</button></div></div><div class="card" style="margin-top:14px"><div class="setting-label"><div><h3 style="margin:0">Размер шрифта</h3><p class="muted" style="margin:5px 0 0">Применяется ко всему приложению.</p></div><b>Аа</b></div><div class="font-options"><button class="font-choice ${fs==='small'?'active':''}" onclick="setFontSize('small')">Мелкий</button><button class="font-choice ${fs==='normal'?'active':''}" onclick="setFontSize('normal')">Обычный</button><button class="font-choice ${fs==='large'?'active':''}" onclick="setFontSize('large')">Крупный</button></div><div class="font-preview"><b>Пример текста</b><span>Hola — Привет · о́ла</span></div></div><div class="card" style="margin-top:14px"><h3>Прогресс</h3><p class="muted">Все данные хранятся только на этом устройстве.</p><button class="danger" onclick="if(confirm('Сбросить весь прогресс?')){localStorage.removeItem(KEY);go('home')}">Сбросить прогресс</button></div></main>`+nav()}
function render(){let h=page==='home'?home():page==='lessons'?lessonList():page==='dictionary'?dictionary():page==='drill'?drill():page==='review'?review():page==='progress'?progress():page==='settings'?settings():page.startsWith('lesson-')?lesson(page.split('-')[1]):home();document.getElementById('app').innerHTML=h;if(page==='drill'&&drillDeck.length){let w=drillDeck[drillPos],k=w.id+':'+drillPos;if(lastAutoSpoken!==k){lastAutoSpoken=k;setTimeout(()=>speak(w.es),120)}}}render();if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js').then(reg=>{reg.update();let refreshing=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(refreshing)return;refreshing=true;location.reload()});reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller){const b=document.createElement('button');b.textContent='Доступна новая версия — Обновить';b.style='position:fixed;left:12px;right:12px;bottom:82px;z-index:20;padding:14px;border:0;border-radius:14px;background:#231f20;color:white;font-weight:800';b.onclick=()=>w.postMessage({type:'SKIP_WAITING'});document.body.appendChild(b)}})})}).catch(()=>{})}
</script></body></html>
