name: Patch web listening

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep stable listening and bump PWA cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          swp=Path('spanish-zero-github-netlify/web/sw.js')
          sw=swp.read_text(encoding='utf-8')
          sw=re.sub(r"const CACHE='[^']+';", "const CACHE='spanish-zero-web-v20-stable-listening';", sw, count=1)
          sw=re.sub(r"get\('app_update'\)!=='[0-9]+'", "get('app_update')!=='20'", sw)
          sw=re.sub(r"set\('app_update','[0-9]+'\)", "set('app_update','20')", sw)
          swp.write_text(sw,encoding='utf-8')
          PY
      - name: Commit PWA refresh
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spanish-zero-github-netlify/web/sw.js
          git commit -m "chore: refresh PWA for stable listening"
          git push origin HEAD:main
