name: Patch web listening

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace listening logic in index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('spanish-zero-github-netlify/web/index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('/* DIRECT_LISTENING_V1 */')
          if start < 0:
              start=s.find('/* DIRECT_LISTENING_V2_STABLE */')
          end=s.find("window.startSelectedDrill=()=>{", start)
          if start < 0 or end < 0:
              raise SystemExit('Listening block not found')
          code=base64.b64decode('').decode('utf-8')
          s=s[:start]+code+'\n'+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit stable listening
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spanish-zero-github-netlify/web/index.html
          git commit -m "fix: stable listening loop [web-controls]"
          git push origin HEAD:main
