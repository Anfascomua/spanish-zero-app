name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch listening logic into index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p = Path('spanish-zero-github-netlify/web/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* DIRECT_LISTENING_V1 */'
          if marker not in s:
              anchor = "window.startSelectedDrill=()=>{"
              code = base64.b64decode('').decode('utf-8')
              if anchor not in s:
                  raise SystemExit('Anchor not found')
              s = s.replace(anchor, code + '\n' + anchor, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit direct listening code
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spanish-zero-github-netlify/web/index.html
          git commit -m "fix: wire listening buttons directly [web-controls]"
          git push origin HEAD:main

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - working-directory: spanish-zero-android
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: spanish-zero-apk
          path: spanish-zero-android/app/build/outputs/apk/debug/app-debug.apk
